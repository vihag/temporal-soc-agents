name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GROK_CLIENT: fixture  # never call a live model in CI
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src services
      - run: uv run pytest -q
